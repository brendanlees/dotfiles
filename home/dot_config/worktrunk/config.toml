[commit.generation]
command = "codex exec -m gpt-6-luna -c model_reasoning_effort='low' -c system_prompt='' --sandbox=read-only --json - | jq -sr '[.[] | select(.item.type? == \"agent_message\")] | last.item.text'"

template = """
<task>Write a conventional commit message for the staged changes below.</task>

<format>
- Use the format: type(scope): description
- Types: feat, fix, chore, docs, style, refactor, perf, test, build, ci
- Scope: the module, component, or area changed (omit parentheses if no clear scope)
- Subject line under 50 chars
- For material changes, add a blank line then a body paragraph explaining the change
- Output only the commit message, no quotes or code blocks
</format>

<style>
- Imperative mood: "add feature" not "added feature"
- Lowercase after the colon
- No period at the end of the subject line
{% if recent_commits %}- Match scope conventions from recent commits{% endif %}
</style>

<diffstat>
{{ git_diff_stat }}
</diffstat>

<diff>
{{ git_diff }}
</diff>

<context>
Branch: {{ branch }}
{% if recent_commits %}<recent_commits>
{% for commit in recent_commits %}- {{ commit }}
{% endfor %}</recent_commits>{% endif %}
</context>

"""

squash-template = """
<task>Write a conventional commit message for the combined effect of these commits.</task>

<format>
- Use the format: type(scope): description
- Types: feat, fix, chore, docs, style, refactor, perf, test, build, ci
- Scope: the module, component, or area changed (omit parentheses if no clear scope)
- Subject line under 50 chars
- For material changes, add a blank line then a body paragraph explaining the change
- Output only the commit message, no quotes or code blocks
</format>

<style>
- Imperative mood: "add feature" not "added feature"
- Lowercase after the colon
- No period at the end of the subject line
- Match the style of commits being squashed
</style>

<commits branch="{{ branch }}" target="{{ target_branch }}">
{% for commit in commit_details %}- {{ commit }}
{% endfor %}</commits>

<diffstat>
{{ git_diff_stat }}
</diffstat>

<diff>
{{ git_diff }}
</diff>

"""

[step.copy-ignored]
exclude = [".mise/"]

[post-switch]
multiplexer-rename = '''
set -eu
if [ "${HERDR_ENV:-}" = 1 ]; then
  herdr tab rename "$HERDR_TAB_ID" {{ branch | sanitize }}
elif [ -n "${TMUX:-}" ] && [ -n "${TMUX_PANE:-}" ]; then
  tmux rename-window -t "$TMUX_PANE" {{ branch | sanitize }}
fi
'''

[post-start]
multiplexer-split = '''
set -eu
if [ "${HERDR_ENV:-}" = 1 ]; then
  PANE_COUNT=$(herdr tab get "$HERDR_TAB_ID" | jq -er '.result.tab.pane_count')
  if [ "$PANE_COUNT" -eq 1 ]; then
    herdr pane split --pane "$HERDR_PANE_ID" --direction right --cwd {{ worktree_path }} --no-focus
  fi
elif [ -n "${TMUX:-}" ] && [ -n "${TMUX_PANE:-}" ]; then
  PANE_COUNT=$(tmux display-message -p -t "$TMUX_PANE" '#{window_panes}')
  if [ "$PANE_COUNT" -eq 1 ]; then
    tmux split-window -h -d -t "$TMUX_PANE" -c {{ worktree_path }}
  fi
fi
'''

[list]
json-schema = 2
