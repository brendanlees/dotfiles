matches:
  # --- CSS ---

  # CSS > Comment (Small / Default)
  - triggers: [";cts", ";template"]
    label: "Comment - CSS: small"
    replace: "/* $|$ */"

  # CSS > Comment (Subtitle)
  - triggers: [";ctm", ";template"]
    label: "Comment - CSS: subtitle"
    replace: "/* --- $|$ --- */"

  # CSS > Comment (Title)
  - triggers: [";ctl", ";template"]
    label: "Comment - CSS: title"
    replace: |

      /* ==========================================
      =! $|$
      ------------------------------------------ */

  # Steady CSS Header
  - triggers: [";cth", ";template"]
    label: "Comment - CSS: Steady header"
    replace: |
      /*
      ==========================================
                 w                 8
           d88b w8ww .d88b .d88 .d88 Yb  dP
          `Yb.  8   8.dP' 8  8 8  8  YbdP
      wwww Y88P  Y8P `Y88P `Y88 `Y88   dP
                                      dP
      ==========================================

      Template:

      Description:

      License:
      For use with websites developed by steadydigital.co only.

      ==========================================

      ==========================================
      $|$
      ------------------------------------------ */

  # --- JavaScript ---

  # JS > Comment (Title)
  - triggers: [";ctjl", ";template"]
    label: "Comment - JavaScript: title"
    replace: |

      // ==========================================
      //=! $|$
      //------------------------------------------

  # JS > Comment (Subtitle)
  - triggers: [";ctjm", ";template"]
    label: "Comment - JavaScript: subtitle"
    replace: "// --- $|$ --- //"

  # Steady JS Header
  - triggers: [";ctjh", ";template"]
    label: "Comment - JavaScript: Steady header"
    replace: |
      //
      //==========================================
      //            w                 8
      //      d88b w8ww .d88b .d88 .d88 Yb  dP
      //     ` Yb.  8   8.dP' 8  8 8  8  YbdP
      // wwww Y88P  Y8P `Y88P `Y88 `Y88   dP
      //                                 dP
      //==========================================

      //Template:

      //Description:

      //License:

      //==========================================

      //==========================================
      //  $|$
      //------------------------------------------

  # --- PHP ---

  # PHP > Comment (Title)
  - triggers: [";ctpl", ";template"]
    label: "Comment - PHP: title"
    replace: |
      /** ==========================================
      * =! $|$
      *------------------------------------------ */

  # PHP > Comment (Subtitle)
  - triggers: [";ctpm", ";template"]
    label: "Comment - PHP: block"
    replace: |
      /**
       * $|$
       */

  # PHP > Comment
  - triggers: [";ctps", ";template"]
    label: "Comment - PHP: inline"
    replace: "/** $|$ */"

  # PHP > Comment (Function)
  - triggers: [";ctpf", ";template"]
    label: "Comment - PHP: function with date"
    replace: |
      /*
       * @function $|$
       * @since {{mydate}}
       * @author brendan lees (steadydigital.co)
       */
    vars:
      - name: mydate
        type: date
        params:
          format: "%d-%m-%Y"

  # --- Bash ---

  # Bash > Comment (Title / Large)
  - triggers: [";ctbl", ";template"]
    label: "Comment - Bash: title"
    replace: |
      # ------------------------------------------
      # $|$
      # ------------------------------------------

  # Bash > Comment (Subtitle / Medium)
  - triggers: [";ctbm", ";template"]
    label: "Comment - Bash: subtitle"
    replace: "# --- $|$ ---"
