# Shared ;template aliases open Espanso's searchable selection dialog.
matches:
  # CSS > Media Query - Phone
  - triggers: [";mq-md", ";template"]
    label: "CSS - Media query: phone"
    replace: |
      @media (max-width: 768px) {
      	$|$
      }

  # CSS > Media Query - Small Phone
  - triggers: [";mq-sm", ";template"]
    label: "CSS - Media query: small phone"
    replace: |
      @media (max-width: 480px) {
      	$|$
      }

  # CSS > Media Query - Blank
  - triggers: [";mq--", ";template"]
    label: "CSS - Media query: custom range"
    replace: |
      @media (min-width: ) and (max-width: ) {
      	$|$
      }

  # CSS > Quick Spacing Utilities
  - triggers: [";utspace", ";template"]
    label: "CSS - Spacing utilities"
    replace: |
      --space-m: 1rem;
      --space-l: calc(var(--space-m)*2);
      --space-xl: calc(var(--space-m)*4);

  # CSS > Data Selector
  - triggers: [";csdata", ";template"]
    label: "CSS - Class selector"
    replace: '[class*="example"]'

  # HTML > Break
  - trigger: "<br"
    replace: "<br/>"

  # HTML > New break space
  - trigger: "&nb"
    replace: "&nbsp;"

  # HTML > </bl> branding
  - trigger: ";bl-branding"
    replace: "&lt;/bl&gt;"
