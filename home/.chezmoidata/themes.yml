      muted: "#a9b1d6"
      fg: "#c0caf5"
      accent: "#73daca"
      primary: "#7aa2f7"
      primary_alt: "#769ff0"
      secondary: "#bb9af7"
      success: "#9ece6a"
      warn: "#e0af68"
      error: "#f7768e"
      info: "#7dcfff"
      info_alt: "#2ac3de"
      orange: "#ff9e64"
      tool_neutral_bg: "#20232d"
      tool_error_bg: "#271d27"
    apps:
      ghostty: "TokyoNight Night"
      btop: "tokyonight_night"
      bat: "tokyonight_night"
      glow: "tokyo-night"
      starship: "tokyo-night"
      tmux_ukiyo: "tokyonight/night"
