# Managed by chezmoi. See: herdr plugin config-dir herdr-navigator

[picker]
engine = "nucleo"
check_updates = true
vim_mode = true
vim_filter_search = true
preview = false
detailed_rows = true

[theme]
inherit_herdr = true

# Herdr's native previous_workspace key tracks every focus path. Navigator's
# history only tracks workspace changes made through its picker.
[jump_back]
enabled = false
pin_previous = false

[sources]
open_workspaces = true
agents = true
herdr_plus_projects = true
sessions = true
servers = true
zoxide = false
roots = false

[notifications]
enabled = false
