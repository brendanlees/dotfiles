name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ACTIONLINT_VERSION: 1.7.12
  CHEZMOI_VERSION: 2.71.1
  SHELLCHECK_VERSION: 0.11.0
  TAPLO_VERSION: 0.10.0
  YAMLLINT_VERSION: 1.38.0

jobs:
  policy-lint:
    name: policy and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: install pinned lint tools
        run: bash tests/ci/install-linux-tools.sh lint

      - name: run static policy and lint
        run: bash tests/ci/check-static.sh

  repository-tests:
    name: repository tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: install pinned chezmoi
        run: bash tests/ci/install-linux-tools.sh chezmoi

      - name: verify test runtimes
        run: |
          bash -c '(( BASH_VERSINFO[0] >= 4 ))'
          python3 -c 'import sys, tomllib; assert sys.version_info >= (3, 11)'
          jq --version
          chezmoi --version

      - name: run repository tests
        run: bash tests/ci/run-chezmoi-tests.sh

  template-smoke:
    name: template smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CHEZMOI_ROLE: ephemeral,headless
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: install pinned tools
        run: bash tests/ci/install-linux-tools.sh all

      - name: initialize ephemeral config
        run: |
          config="${RUNNER_TEMP}/chezmoi-config.toml"
          chezmoi init \
            --source="$GITHUB_WORKSPACE" \
            --config="$config" \
            --apply=false

      - name: render and lint templates
        env:
          CHEZMOI_CONFIG_FILE: ${{ runner.temp }}/chezmoi-config.toml
        run: bash tests/ci/render-and-lint.sh

  apply-dry-run:
    name: apply dry-run (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    env:
      CHEZMOI_ROLE: ephemeral,headless
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: install pinned chezmoi on Linux
        if: runner.os == 'Linux'
        run: bash tests/ci/install-linux-tools.sh chezmoi

      - name: install pinned chezmoi on macOS
        if: runner.os == 'macOS'
        run: |
          case "$(uname -m)" in
            arm64)
              arch=arm64
              sha=9fad1201c328428634b8a086f767df0dfe6dd3ea1128a2a7c45bc0b16641e294
              ;;
            x86_64)
              arch=amd64
              sha=1551f07cab00441540a12e663ffbf4645664319c0f91d30a5f9a255470b561cc
              ;;
            *)
              echo "unsupported macOS architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          mkdir -p "$HOME/.local/bin"
          asset="chezmoi_${CHEZMOI_VERSION}_darwin_${arch}.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$asset" \
            "https://github.com/twpayne/chezmoi/releases/download/v${CHEZMOI_VERSION}/$asset"
          printf '%s  %s\n' "$sha" "$RUNNER_TEMP/$asset" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP" chezmoi
          install -m 0755 "$RUNNER_TEMP/chezmoi" "$HOME/.local/bin/chezmoi"
          printf '%s\n' "$HOME/.local/bin" >>"$GITHUB_PATH"

      - name: initialize and dry-run
        run: |
          config="${RUNNER_TEMP}/chezmoi-config.toml"
          chezmoi init \
            --source="$GITHUB_WORKSPACE" \
            --config="$config" \
            --apply=false
          chezmoi apply \
            --source="$GITHUB_WORKSPACE" \
            --config="$config" \
            --dry-run \
            --verbose \
            --exclude=externals

      - name: lint property lists
        if: runner.os == 'macOS'
        run: |
          failures=0
          while IFS= read -r plist; do
            plutil -lint "$plist" || failures=$((failures + 1))
          done < <(git ls-files '*.plist')
          ((failures == 0))

  powershell-windows:
    name: PowerShell on Windows
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      CHEZMOI_ROLE: ephemeral,headless
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: install pinned chezmoi
        shell: pwsh
        run: |
          $asset = "chezmoi_$env:CHEZMOI_VERSION`_windows_amd64.zip"
          $zip = Join-Path $env:RUNNER_TEMP $asset
          $url = "https://github.com/twpayne/chezmoi/releases/download/v$env:CHEZMOI_VERSION/$asset"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          $expected = 'efdb5ae7e8e455e8f7c1b3d7d97beb7e946d9234f58d73945b78aaf6a5e92de6'
          if ($actual -ne $expected) {
            throw "chezmoi checksum mismatch: $actual"
          }
          $destination = Join-Path $env:RUNNER_TEMP 'chezmoi'
          Expand-Archive $zip -DestinationPath $destination
          Add-Content -Path $env:GITHUB_PATH -Value $destination

      - name: initialize Windows ephemeral config
        shell: pwsh
        run: |
          $config = Join-Path $env:RUNNER_TEMP 'chezmoi-config.toml'
          chezmoi init `
            --source=$env:GITHUB_WORKSPACE `
            --config=$config `
            --apply=false

      - name: parse static and rendered PowerShell
        shell: pwsh
        env:
          CHEZMOI_CONFIG_FILE: ${{ runner.temp }}/chezmoi-config.toml
        run: pwsh -NoProfile -File tests/ci/check-powershell.ps1
